name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation in your project rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the tool to do?
    validations:
      required: false
  - type: textarea
    id: plugin
    attributes:
      label: Is a particular plugin involved?
      description: If this is about a plugin that stores asset names or ids, link it and show the relevant lines of its header.
    validations:
      required: false
